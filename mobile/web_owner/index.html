<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mauban Sanitation Owner Portal">
  <meta name="theme-color" content="#1E6B45">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mauban Sanitation">
  <link rel="icon" type="image/png" href="favicon_sanitation.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>Mauban Sanitation Owner Portal</title>
  <script>
    // Flutter sets its own title during startup; keep this public shell's title fixed.
    const ownerTitle = 'Mauban Sanitation Owner Portal';
    new MutationObserver(() => {
      if (document.title !== ownerTitle) document.title = ownerTitle;
    }).observe(document.querySelector('title'), { childList: true, characterData: true, subtree: true });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
