<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mauban Tourism Pass & Sanitary Compliance Mobile Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mauban Portal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Dynamic Favicon -->
  <link id="dynamic-favicon" rel="icon" type="image/png" href="favicon_tourism.png"/>

  <title>Mauban Tourism & Travel Pass</title>
  <link rel="manifest" href="manifest.json">

  <script>
    function updateWebBranding(moduleName) {
      if (typeof moduleName === 'string' && (moduleName === 'sanitation' || moduleName === 'tourism')) {
        window._activeWebBrandingModule = moduleName;
        try {
          window.sessionStorage.setItem('active_web_branding_module', moduleName);
        } catch (e) {}
      }

      var active = window._activeWebBrandingModule;
      if (!active) {
        try {
          active = window.sessionStorage.getItem('active_web_branding_module');
        } catch (e) {}
      }

      var isSanitation = false;
      if (active === 'sanitation') {
        isSanitation = true;
      } else if (active === 'tourism') {
        isSanitation = false;
      } else {
        var href = (window.location.href || '').toLowerCase();
        isSanitation = href.indexOf('sanitation') !== -1;
        var initial = isSanitation ? 'sanitation' : 'tourism';
        window._activeWebBrandingModule = initial;
      }

      var title = isSanitation
        ? 'Mauban Sanitation & Health Portal'
        : 'Mauban Tourism & Travel Pass';

      var favicon = isSanitation
        ? 'favicon_sanitation.png'
        : 'favicon_tourism.png';

      document.title = title;

      var link = document.getElementById('dynamic-favicon') || document.querySelector("link[rel*='icon']");
      if (!link) {
        link = document.createElement('link');
        link.id = 'dynamic-favicon';
        link.rel = 'icon';
        document.head.appendChild(link);
      }
      link.type = 'image/png';
      link.href = favicon;
    }
    window.updateWebBranding = updateWebBranding;
    window.getActiveWebBranding = function() {
      var mod = window._activeWebBrandingModule;
      if (!mod) {
        try {
          mod = window.sessionStorage.getItem('active_web_branding_module');
        } catch (e) {}
      }
      return mod || null;
    };
    window.downloadBlob = function(base64Data, fileName, mimeType) {
      try {
        var byteCharacters = atob(base64Data);
        var byteNumbers = new Array(byteCharacters.length);
        for (var i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        var byteArray = new Uint8Array(byteNumbers);
        var blob = new Blob([byteArray], { type: mimeType || 'application/octet-stream' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
      } catch (e) {
        console.error('Browser download error:', e);
      }
    };
    try {
      updateWebBranding();
    } catch (e) {}
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
