name: Keep-Alive and Notification Scheduler

on:
  schedule:
    # 1. Keep-alive ping every 10 minutes to prevent Render free-tier spin down
    - cron: '*/10 * * * *'
    # 2. Daily due notifications evaluation at 6:00 AM Philippine Standard Time (22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Keep-Alive Health Ping
    # Runs every 10 minutes and on manual trigger
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *' || github.event.schedule == '0 22 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        continue-on-error: true
        run: |
          echo "Sending keep-alive ping to Render backend..."
          response=$(curl -sf -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s" --max-time 60 https://capstone-backend-stzr.onrender.com/api/health/ || echo "CURL_FAILED")
          echo "$response"
          if echo "$response" | grep -q "HTTP_STATUS:200"; then
            echo "Backend is active and healthy."
          else
            echo "Warning: Keep-alive ping did not return 200 (backend may be cold-starting). Will retry next cycle."
          fi

  evaluate-due-notifications:
    name: Evaluate Due Notifications
    # Runs only once daily at 22:00 UTC (6:00 AM PHT) or on manual trigger
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Due Notifications Evaluation
        run: |
          echo "Triggering evaluate-due notifications scan..."
          response=$(curl -sf -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s" --max-time 90 \
            -X POST https://capstone-backend-stzr.onrender.com/api/notifications/evaluate-due/ \
            -H "X-Cron-Key: ${{ secrets.CRON_SECRET_KEY }}")
          echo "$response"
          if echo "$response" | grep -q "HTTP_STATUS:200"; then
            echo "Due notifications evaluated successfully."
          else
            echo "Error: Notification evaluation returned non-200 status."
            exit 1
          fi
